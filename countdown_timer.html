<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Countdown Timer</title>
  <style>
    /* Configurable CSS variables */
    :root {
      /* Circle size and font inside */
      --circle-size: 60px;
      --digit-font-size: 1.5em;

      /* Gap between digits */
      --digit-gap: 10px;

      /* Separator styling */
      --separator-width: 2px;
      --separator-height: 60px;
      --separator-margin: 0 10px;

      /* Text color variables */
      --circle-color: darkblue;
      --circle-text-color: white;
      --text-color: white;
    }

    body {
      background-color: transparent;
      color: var(--text-color);
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px 0;
    }

    h1 {
      margin: 0 0 20px;
    }

    .time-groups-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }

    .time-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 5px;
    }

    .digits {
      display: flex;
      gap: var(--digit-gap);
    }

    .digit {
      width: var(--circle-size);
      height: var(--circle-size);
      background-color: var(--circle-color);
      color: var(--circle-text-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--digit-font-size);
    }

    .label {
      margin-top: 10px;
      font-size: 1em;
    }

    .separator {
      width: var(--separator-width);
      background-color: var(--text-color);
      margin: var(--separator-margin);
      height: var(--separator-height);
      flex-shrink: 0;
    }

    .message {
      font-size: 1.5em;
      margin-top: 20px;
    }

    /* Mobile overrides */
    @media (max-width: 480px) {
      :root {
        --circle-size: 40px;
        --digit-font-size: 1em;
        --digit-gap: 5px;
        --separator-height: 40px;
        --separator-margin: 0 5px;
      }
      h1 {
        font-size: 1.2em;
        margin-bottom: 10px;
      }
      .label {
        margin-top: 8px;
        font-size: 0.9em;
      }
      .message {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>
  <h1>Countdown to The Ride</h1>

  <div id="timerDisplay" class="time-groups-container">
    <div class="time-group" id="days-group">
      <div class="digits"></div>
      <div class="label">Days</div>
    </div>
    <div class="separator"></div>
    <div class="time-group" id="hours-group">
      <div class="digits"></div>
      <div class="label">Hours</div>
    </div>
    <div class="separator"></div>
    <div class="time-group" id="minutes-group">
      <div class="digits"></div>
      <div class="label">Min</div>
    </div>
    <div class="separator"></div>
    <div class="time-group" id="seconds-group">
      <div class="digits"></div>
      <div class="label">Sec</div>
    </div>
  </div>

  <div id="message" class="message"></div>

  <script>
    const eventStart = new Date("June 6, 2025 08:15:00");
    const eventEnd   = new Date("June 6, 2025 17:00:00");
    const rideRouteURL = "https://rfmc-mv.org/ride-route";

    function splitIntoDigits(value, padLength) {
      let str = value.toString();
      return (padLength ? str.padStart(padLength, '0') : str).split('');
    }

    function updateGroup(groupId, value, padLength) {
      const container = document.querySelector(`#${groupId} .digits`);
      container.innerHTML = splitIntoDigits(value, padLength)
        .map(d => `<div class="digit">${d}</div>`)
        .join('');
    }

    function updateTimer() {
      const now = new Date();

      if (now >= eventStart && now < eventEnd) {
        document.getElementById("timerDisplay").style.display = "none";
        document.getElementById("message").innerHTML =
          `<a href="${rideRouteURL}" target="_blank">Click here to find us on our route!</a>`;
      }
      else if (now >= eventEnd) {
        document.getElementById("timerDisplay").style.display = "none";
        document.getElementById("message").textContent = "See you next year!";
      }
      else {
        document.getElementById("timerDisplay").style.display = "flex";
        document.getElementById("message").textContent = "";
        const diff = eventStart - now;
        const days    = Math.floor(diff / (1000*60*60*24));
        const hours   = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
        const minutes = Math.floor((diff % (1000*60*60))    / (1000*60));
        const seconds = Math.floor((diff % (1000*60))       / 1000);

        updateGroup('days-group',    days,    2);
        updateGroup('hours-group',   hours,   2);
        updateGroup('minutes-group', minutes, 2);
        updateGroup('seconds-group', seconds, 2);
      }
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
